# leaves their meshes as orphans, then CANCELLED with Blender's WARNING ('No mesh data to
# join'); move/link_to_collection INFO reports and 'No collection selected'; the slot
# operators' reports; material.new does not assign a slot; collection_link's dynamic items.
# Statements on stdin (raw mode, §13.1), both syntaxes.
bin.name = "frap"
args = []
fs.sandbox = true
