# remove / clear with keyed and indexed reads, marker camera switching at scene.frame_set() but
# not at a frame_current assignment, make_links_scene's errors and its copy. Every message and
# value verified on Blender 5.2.4 (the operators in a Timeline temp_override). Statements on
# stdin (raw mode, §13.1).
