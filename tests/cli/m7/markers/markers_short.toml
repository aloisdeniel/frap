# selected: `No markers are selected`; tool_settings.lock_markers: `Markers are locked`),
# marker.add (`F_<frame>`, selected, others deselected; cancelled on an occupied frame),
# select_leftright, move and duplicate (copies at the head of the list), rename, camera_bind (the
