# glTF round-trip law (ARCHITECTURE §17.2, WP 1.23): for every file listed here,
#   gltf_canonical(frap import → frap export) == gltf_canonical(Blender import → Blender export)
# with default options. Paths are relative to tests/data/. Blender's re-exports are committed
# under tests/golden/fixtures/gltf/m1/roundtrip/ (re-bless with FRAP_ROUNDTRIP_BLESS=1, see
# crates/frap-ops-io-tests/tests/gltf_roundtrip.rs). Files with content frap does not import or
# export yet (skins, morph targets, animation, instancing) are not listed; the M3 static
# content (strips/fans, lines, points, vertex colours, texture transforms, scenes, lights,
# cameras, unlit, emissive strength) was added by WP 3.9. LightVisibility is left out:
# Blender 5.2.4's add-on refuses its required KHR_node_visibility.

