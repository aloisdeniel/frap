#
# Types of `bpy.context` members that are not RNA properties of `Context` (RFC 0001 F-DEF-5).
# `dump_rna.py` infers the kind and type of each member from live values in four states (object,
# pose, armature edit and mesh edit mode, VIEW_3D override); members never seen non-None get their
# type here, from Blender's context documentation (`bpy.context` API reference, 5.2) and
# `screen_context.cc` / `view3d_view.cc` context callbacks. Codegen synthesises one
# `READONLY | CONTEXT_MEMBER` PropDef per member (POINTER or COLLECTION of `type`).
#
# Entries here override the inferred kind/type; members listed here but not dumped are added
# (buttons-context members frap supports: `material`, `material_slot`, `mesh`, …).

[members]
active_action = { kind = "pointer", type = "Action" }
active_annotation_layer = { kind = "pointer", type = "AnnotationLayer" }
active_bone = { kind = "pointer", type = "EditBone" }
