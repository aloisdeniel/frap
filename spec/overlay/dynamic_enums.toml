#
# Dynamic enum supersets (ARCHITECTURE §4.2, RFC 0001 F-DEF-6). Blender fills these enums from a
# callback that sees the current context; in `-b --factory-startup` with no instance the dumps
# get an empty list, a placeholder ('NONE') or a context-dependent subset, so codegen takes the
# items from here. `coerce` validates against the generated item list, and `frap-op`'s
# `DynEnumFn` (OperatorDef.dyn_enums) narrows `runtime` enums to the live context.
#
# Key: "<BL_IDNAME>.<prop>" for operator props, "<Struct>.<prop>" for RNA struct props.
# Fields:
#   items      = [[identifier, name, description, value], ...]   explicit superset
#   items_from = "op:<BL_IDNAME>.<prop>" | "rna:<Struct>.<prop>" the dumped items of another enum
#   runtime    = true   items depend on user data / live context (DynEnumFn); `items` may be empty
#   default    = "X"    replaces the dumped default (which may be "" or a placeholder)
#   source     = where the superset was verified
# An enum is dynamic when the dump says so (`items_static` differs from `items`, a non-flag enum
# with no items, or items that differ between poll contexts) or when it is listed here. Codegen
# fails on a dynamic enum with no items unless it is listed here (explicit decision per enum).
#
# Unless noted, item lists were verified on Blender 5.2.4 `-b --factory-startup` by assigning an
# invalid value on a live instance / calling the operator in the factory scene with a VIEW_3D
# override (the TypeError lists the items the callback returns) and reading names with
# `UILayout.enum_item_name/enum_item_description`. Values are the item index unless known.
# UNVERIFIED: Blender does not expose `EnumPropertyItem.value` of callback enums in `-b`, so the
# numeric values of runtime-built items (render engines, OCIO view/look/display/colorspace
# names, studio lights) are assumed, not dumped. Do not rely on `EnumItem.value` for these enums;
# a consumer that needs it must first check the C item builder
# (`RE_engines`, `colormanagement_*_items_add`, `BKE_studiolight_*`) and add a provenance note.

# ---------------------------------------------------------------- RNA struct properties

