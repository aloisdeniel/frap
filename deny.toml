# SPDX-License-Identifier: GPL-3.0-or-later
#
# cargo-deny (ARCHITECTURE §3.1, §20.5): licences compatible with GPL-3.0-or-later, RustSec
# advisories, banned crates and sources. CI: `cargo deny check`.

[graph]
all-features = false
no-default-features = false

[advisories]
# RustSec database; yanked crates fail too.
yanked = "deny"
ignore = [
    # humantime (via trycmd -> humantime-serde): unmaintained because chrono is; no safe upgrade
    # exists. Dev-only (frap-cli transcript tests), never linked into the frap binary.
    { id = "RUSTSEC-2026-0542", reason = "dev-only via trycmd; no maintained alternative yet" },
]

[licenses]
# frap is GPL-3.0-or-later (§24 D1). Every licence below is GPL-3 compatible.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# M4 W0: opensubdiv-rs (optional `subdiv-osd` backend of frap-subdiv, off by default, §3.6) ports
# Pixar's OpenSubdiv under its "Modified Apache 2.0" licence (TOST-1.0: Apache-2.0 plus a
# trademark clause), the licence Blender's own GPL builds ship OpenSubdiv under. Allowed for that
# crate only; the decision on the default backend is WP 4.4's gate.
exceptions = [
    { allow = ["LicenseRef-TOST-1.0"], crate = "opensubdiv-rs" },
]

[licenses.private]
# Workspace crates are `publish = false`; they are checked against the allow list too.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # §3.5 "Not used": AGPL WebP encoder, and the rejected alternatives.
    { crate = "zenwebp", reason = "AGPL (§3.5)" },
    # Allowed only inside the dev-only `gltf =1.4.1` validator.
    { crate = "gltf-json", wrappers = ["gltf"], reason = "frap-gltf is the write model (§3.5)" },
    { crate = "nalgebra", reason = "glam + faer only (§3.5)" },
    { crate = "chumsky", reason = "hand-written parser (§3.5)" },
    { crate = "csgrs", reason = "manifold-rust behind BooleanSolver (§3.5)" },
    { crate = "manifold3d", reason = "manifold-rust behind BooleanSolver (§3.5)" },
    { crate = "draco-rs", reason = "draco-core / cc-built fallback (§3.5)" },
    { crate = "opensubdiv-petite", reason = "opensubdiv-rs behind Subdivider (§3.5)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
