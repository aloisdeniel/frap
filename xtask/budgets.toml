#
# Build-time budgets of the generated spec crates (ARCHITECTURE §4.2, §21.7).
# `cargo xtask budgets` rebuilds each crate alone (`cargo clean -p X && cargo build -p X`,
# dependencies cached) and fails when one takes more than `factor` × its recorded baseline.
# `cargo xtask budgets --record` rewrites the baselines (WP 1.1 records them once the crates are
# generated; a baseline of 0 means "not recorded yet" and is reported, not enforced).
# Reference point (RFC 0001 §4): the WP 0.2 probe's generated crate (19 structs, 417 operators,
# 21k lines) built clean in ~3.0 s (debug) on an M1 Max.

factor = 2.0

# PROVISIONAL baselines, WP 1.1, 2026-11-16: NOT recorded on the CI runner class. They come from a
# local Apple M1 Max (10 cores, 32 GiB, macOS 26.6, Rust 1.97, debug profile, dependencies
# cached), measured by hand as one clean rebuild per crate (fresh artifact hash). `budgets
# --record` was not run there because its `cargo clean -p` would have deleted other worktrees'
# artifacts in the shared target dir. The CI `budgets` job runs on ubuntu-24.04, a slower machine
# class, and the sub-second crates are mostly cargo startup and fingerprinting, so these values
# can trip the 2x factor there. Before the job becomes gating, the integrator re-records them on
# ubuntu-24.04 with `cargo xtask budgets --record` (for example in a one-off workflow_dispatch
# run) and commits the output. `--record` keeps only the leading comment block, so this note goes
# away then.
[baseline_secs]
frap-spec-rna = 3.11
frap-spec-ops-object = 1.3
frap-spec-ops-transform = 0.68
frap-spec-ops-mesh = 2.25
frap-spec-ops-uv = 0.46
frap-spec-ops-anim = 0.46
frap-spec-ops-data = 1.97
frap-spec-ops-io = 0.61
frap-spec-ops-render = 0.39
frap-spec-ops-frap = 0.43
frap-spec-catalog = 0.66
