[package]
name = "xtask"
description = "frap developer tasks: cargo xtask check-deps | budgets | codegen [--check] | golden (ARCHITECTURE §3.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Tooling, not a layer of §3.2: depends on no frap crate, so `cargo xtask` builds in seconds.
# Owned by WP 1.0 (§22.3). In M1 W1, WP 1.1 (codegen) and WP 1.8 (golden) may append
# `foo.workspace = true` lines below for dependencies already declared in the root
# `[workspace.dependencies]` (decision W0-28); a new external dependency still needs the integrator.
# codegen (the WP 0.2 prototype needs only serde_json + std) and golden (spawns Blender) are
# covered by the entries below as far as known at W0.
[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
indexmap.workspace = true
# WP 1.1: `crates/frap-spec-catalog/src/generated/catalog.json.deflate` (§4.2).
flate2.workspace = true

[lints]
workspace = true
