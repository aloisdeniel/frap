[package]
name = "frap-codec-mesh"
description = "frap L3: DracoCodec (draco-core, fallback frap-draco-sys), MeshoptCodec (meshopt) behind frap traits (ARCHITECTURE §3.2, §17.2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# M7 W0 (decision log M7W0-5). No default features: frap-cli / frap-ops-all choose the backends
# (§3.6); crates whose tests need a codec enable it in their dev-dependencies.
[dependencies]
thiserror.workspace = true

[dependencies.meshopt]
workspace = true
optional = true

[dependencies.draco-core]
workspace = true
optional = true

[dependencies.frap-draco-sys]
workspace = true
optional = true

[dev-dependencies]
proptest.workspace = true
approx.workspace = true

[features]
default = []
# meshoptimizer (cc-built C++, allowed by rule 2.2.9): EXT_/KHR_meshopt_compression (WP 7.1).
meshopt = ["dep:meshopt"]
# draco-core (pure Rust, `=2.3.3`): KHR_draco_mesh_compression (WP 7.2, spike gate).
draco = ["dep:draco-core"]
# Google Draco built with cc (no cmake), the fallback if the draco-core spike fails (WP 7.2).
draco-sys = ["dep:frap-draco-sys"]

[lints]
workspace = true
