[features]
# §3.6. The GPU device itself is created by frap-session (feature `gpu` there); this flag is
# forwarded so `--no-default-features` on frap-cli reaches every crate that cares.
default = []
gpu = []
webp-lossy = ["frap-imbuf/webp-lossy"]
# Wired by the W0 of the milestone that adds the backend (M4: subdiv/boolean, M3: basisu, M7: codecs).
meshopt = []
draco = []
draco-sys = []
basisu = []
basisu-encode = []
subdiv-osd = []
boolean-manifold = []

[lints]
workspace = true
