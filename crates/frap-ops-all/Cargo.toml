[package]
name = "frap-ops-all"
description = "frap L10: Aggregator of every frap-ops-* crate; link() keeps every linkme entry (ARCHITECTURE §10.5)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
frap-ops-object.workspace = true
frap-ops-transform.workspace = true
frap-ops-mesh.workspace = true
frap-ops-uv.workspace = true
frap-ops-anim.workspace = true
frap-ops-data.workspace = true
frap-ops-io.workspace = true
frap-ops-render.workspace = true
frap-ops-frap.workspace = true
frap-imbuf.workspace = true
# M7 W0: the codec backends are features of frap-codec-mesh (and frap-imbuf for Basis), forwarded
# from here so frap-cli's `--no-default-features` reaches them (§3.6).
frap-codec-mesh.workspace = true
frap-subdiv.workspace = true
frap-boolean.workspace = true
frap-modifiers.workspace = true

[dev-dependencies]
frap-op.workspace = true
frap-rna.workspace = true
frap-scene.workspace = true
frap-mesh.workspace = true
frap-nodes.workspace = true
frap-bmesh.workspace = true
frap-math.workspace = true
frap-anim.workspace = true
frap-material.workspace = true
frap-eval.workspace = true
frap-render-scene.workspace = true
frap-render.workspace = true
frap-io-gltf.workspace = true
frap-gltf.workspace = true
frap-lang.workspace = true
frap-spec-rna.workspace = true
frap-spec-ops-mesh.workspace = true
frap-spec-ops-io.workspace = true
glam.workspace = true
smol_str.workspace = true
indexmap.workspace = true
smallvec.workspace = true
linkme.workspace = true
serde_json.workspace = true
frap-uv.workspace = true
frap-color.workspace = true
frap-geom.workspace = true

[features]
# §3.6. The GPU device itself is created by frap-session (feature `gpu` there); this flag is
# forwarded so `--no-default-features` on frap-cli reaches every crate that cares.
default = []
gpu = []
webp-lossy = ["frap-imbuf/webp-lossy"]
# M7 W0 (decision log M7W0-5): the codec backends (§3.6, §22.9).
meshopt = ["frap-codec-mesh/meshopt"]
draco = ["frap-codec-mesh/draco"]
draco-sys = ["frap-codec-mesh/draco-sys"]
basisu = ["frap-imbuf/basisu"]
basisu-encode = ["frap-imbuf/basisu-encode"]
# M4 W0: the OpenSubdiv backend of `Subdivider`. Since the M4 gate (decision log M34S3-1)
# frap-subdiv enables it by default (its Gregory end caps); the flag stays for §3.6's matrix.
subdiv-osd = ["frap-subdiv/osd"]
# M4 W0: the manifold-rust backend of `BooleanSolver`. frap-boolean enables it by default (so
# per-crate test builds have a solver); the flag stays for the feature matrix of §3.6.
boolean-manifold = ["frap-boolean/manifold"]

[lints]
workspace = true
