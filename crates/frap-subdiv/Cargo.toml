[package]
name = "frap-subdiv"
description = "frap L3: Subdivider trait, own Catmull-Clark, optional opensubdiv-rs backend (ARCHITECTURE §3.2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
frap-math.workspace = true
glam.workspace = true
libm.workspace = true
smallvec.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true

[dependencies.opensubdiv-rs]
workspace = true
optional = true

[dev-dependencies]
approx.workspace = true
proptest.workspace = true
serde_json.workspace = true

[features]
# §3.6 `subdiv-osd`: the OpenSubdiv backend. On by default since the M4 gate (decision log): frap's
# own Catmull-Clark evaluates Blender's Gregory end caps (levels above quality, SIMPLE past
# level 1) through its patch table. On by default here so per-crate test builds match Blender.
default = ["osd"]
osd = ["dep:opensubdiv-rs"]

[lints]
workspace = true
