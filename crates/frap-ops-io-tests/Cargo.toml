[package]
name = "frap-ops-io-tests"
description = "frap test-only crate (rule 2.2.11): behaviour tests of the IO operators through a real Session, e.g. the WP 1.23 proptest random M1 op sequences -> save -> open -> identical state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Test-only: nothing depends on this crate, so it may depend on frap-session (L11) without a
# dev-dependency cycle (`frap-ops-io` itself must not, rule 2.2.11). Owned by WP 1.23 (M1).
[dependencies]

[dev-dependencies]
frap-session.workspace = true
# M7 W0: the codecs the compression and texture-format tests need (WPs 7.1-7.3); WP 7.3 adds
# lossy WebP (`export_image_format='WEBP'` at quality < 100, as frap-cli's default build) and
# frap-imbuf to decode the images it compares.
frap-ops-all = { workspace = true, features = ["meshopt", "draco", "basisu", "webp-lossy"] }
frap-imbuf = { workspace = true, features = ["basisu"] }
frap-scene.workspace = true
frap-rna.workspace = true
frap-project.workspace = true
frap-gltf.workspace = true
frap-nodes.workspace = true
frap-spec-ops-io.workspace = true
frap-io-gltf.workspace = true
# WP 1.23: the glTF round-trip law (allow list, canonical comparison, Blender reference runs).
frap-golden.workspace = true
glam.workspace = true
proptest.workspace = true
insta.workspace = true
serde_json.workspace = true

[lints]
workspace = true
