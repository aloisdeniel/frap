# Rule 2.2.12 (portable transcendentals, §21.4): the platform libm differs in the last bit across
# macOS/Linux/Windows, so geometry and math crates call `libm::*` instead. `sqrt`, `mul_add`,
# `abs`, `floor`/`ceil`/`round*` are exact IEEE operations and stay allowed. Owned by the
# integrator; this file is identical in frap-math, -geom, -mesh, -bmesh, -uv, -subdiv, -anim,
# -modifiers (`cargo xtask check-deps` does not check it; reviewers do).
disallowed-methods = [
    { path = "f32::sin", reason = "rule 2.2.12: use libm::sinf" },
    { path = "f32::cos", reason = "rule 2.2.12: use libm::cosf" },
    { path = "f32::tan", reason = "rule 2.2.12: use libm::tanf" },
    { path = "f32::sin_cos", reason = "rule 2.2.12: use libm::sincosf" },
    { path = "f32::asin", reason = "rule 2.2.12: use libm::asinf" },
    { path = "f32::acos", reason = "rule 2.2.12: use libm::acosf" },
    { path = "f32::atan", reason = "rule 2.2.12: use libm::atanf" },
    { path = "f32::atan2", reason = "rule 2.2.12: use libm::atan2f" },
    { path = "f32::sinh", reason = "rule 2.2.12: use libm::sinhf" },
    { path = "f32::cosh", reason = "rule 2.2.12: use libm::coshf" },
    { path = "f32::tanh", reason = "rule 2.2.12: use libm::tanhf" },
    { path = "f32::asinh", reason = "rule 2.2.12: use libm::asinhf" },
    { path = "f32::acosh", reason = "rule 2.2.12: use libm::acoshf" },
    { path = "f32::atanh", reason = "rule 2.2.12: use libm::atanhf" },
    { path = "f32::exp", reason = "rule 2.2.12: use libm::expf" },
    { path = "f32::exp2", reason = "rule 2.2.12: use libm::exp2f" },
    { path = "f32::exp_m1", reason = "rule 2.2.12: use libm::expm1f" },
    { path = "f32::ln", reason = "rule 2.2.12: use libm::logf" },
    { path = "f32::log", reason = "rule 2.2.12: use libm::logf(x) / libm::logf(base)" },
    { path = "f32::log2", reason = "rule 2.2.12: use libm::log2f" },
    { path = "f32::log10", reason = "rule 2.2.12: use libm::log10f" },
    { path = "f32::ln_1p", reason = "rule 2.2.12: use libm::log1pf" },
    { path = "f32::powf", reason = "rule 2.2.12: use libm::powf" },
    { path = "f32::powi", reason = "rule 2.2.12: llvm.powi is not correctly rounded; use libm::powf or multiply" },
    { path = "f32::cbrt", reason = "rule 2.2.12: use libm::cbrtf" },
    { path = "f32::hypot", reason = "rule 2.2.12: use libm::hypotf" },
    { path = "f64::sin", reason = "rule 2.2.12: use libm::sin" },
    { path = "f64::cos", reason = "rule 2.2.12: use libm::cos" },
    { path = "f64::tan", reason = "rule 2.2.12: use libm::tan" },
    { path = "f64::sin_cos", reason = "rule 2.2.12: use libm::sincos" },
    { path = "f64::asin", reason = "rule 2.2.12: use libm::asin" },
    { path = "f64::acos", reason = "rule 2.2.12: use libm::acos" },
    { path = "f64::atan", reason = "rule 2.2.12: use libm::atan" },
    { path = "f64::atan2", reason = "rule 2.2.12: use libm::atan2" },
    { path = "f64::sinh", reason = "rule 2.2.12: use libm::sinh" },
    { path = "f64::cosh", reason = "rule 2.2.12: use libm::cosh" },
    { path = "f64::tanh", reason = "rule 2.2.12: use libm::tanh" },
    { path = "f64::asinh", reason = "rule 2.2.12: use libm::asinh" },
    { path = "f64::acosh", reason = "rule 2.2.12: use libm::acosh" },
    { path = "f64::atanh", reason = "rule 2.2.12: use libm::atanh" },
    { path = "f64::exp", reason = "rule 2.2.12: use libm::exp" },
    { path = "f64::exp2", reason = "rule 2.2.12: use libm::exp2" },
    { path = "f64::exp_m1", reason = "rule 2.2.12: use libm::expm1" },
    { path = "f64::ln", reason = "rule 2.2.12: use libm::log" },
    { path = "f64::log", reason = "rule 2.2.12: use libm::log(x) / libm::log(base)" },
    { path = "f64::log2", reason = "rule 2.2.12: use libm::log2" },
    { path = "f64::log10", reason = "rule 2.2.12: use libm::log10" },
    { path = "f64::ln_1p", reason = "rule 2.2.12: use libm::log1p" },
    { path = "f64::powf", reason = "rule 2.2.12: use libm::pow" },
    { path = "f64::powi", reason = "rule 2.2.12: llvm.powi is not correctly rounded; use libm::pow or multiply" },
    { path = "f64::cbrt", reason = "rule 2.2.12: use libm::cbrt" },
    { path = "f64::hypot", reason = "rule 2.2.12: use libm::hypot" },
]
