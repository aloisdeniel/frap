[package]
name = "frap-io-gltf"
description = "frap L9: Scene <-> glTF with io_scene_gltf2 5.2.41 semantics; module structure mirrors the add-on (ARCHITECTURE §17.2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
frap-rna.workspace = true
frap-gltf.workspace = true
frap-scene.workspace = true
# WP 6.7: animation export samples F-curves and object matrices; import builds actions.
# WP 6.9: KHR_animation_pointer samples and creates animation data too.
frap-anim.workspace = true
frap-eval.workspace = true
frap-mesh.workspace = true
# WP 1.17 `merge_vertices` welding uses the spatial hash of §3.2 directly.
frap-geom.workspace = true
frap-nodes.workspace = true
frap-material.workspace = true
frap-imbuf.workspace = true
# M7 W0: Draco and meshopt through the codec traits (WPs 7.1, 7.2); the backends are features of
# frap-codec-mesh chosen by frap-cli / frap-ops-all (§3.6), enabled for this crate's tests below.
frap-codec-mesh.workspace = true
frap-math.workspace = true
frap-spec-ops-io.workspace = true
glam.workspace = true
linkme.workspace = true
automod.workspace = true
indexmap.workspace = true
smol_str.workspace = true
serde_json.workspace = true
thiserror.workspace = true
libm.workspace = true
smallvec.workspace = true

[dev-dependencies]
frap-codec-mesh = { workspace = true, features = ["meshopt", "draco"] }
frap-imbuf = { workspace = true, features = ["basisu"] }
gltf.workspace = true
insta.workspace = true
proptest.workspace = true
approx.workspace = true

[lints]
workspace = true
