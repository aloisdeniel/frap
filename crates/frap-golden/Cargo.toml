[package]
name = "frap-golden"
description = "frap L12: GoldenState schema, frap-side and Blender runners, comparators, fixtures, bless. Dev only (ARCHITECTURE §20)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
frap-rna.workspace = true
frap-lang.workspace = true
frap-session.workspace = true
# M7 W1 (WPs 7.1, 7.2, 7.3): the in-process frap side of the goldens runs with frap-cli's default
# codecs (meshopt, Draco, Basis/KTX2, lossy WebP), also under `cargo test -p frap-golden`
# (`cargo xtask golden live`), which resolves only this crate's features.
frap-ops-all = { workspace = true, features = ["meshopt", "draco", "basisu", "webp-lossy"] }
frap-scene.workspace = true
frap-mesh.workspace = true
frap-geom.workspace = true
frap-anim.workspace = true
# WP 1.8: the frap-side dumper's fallback reads node trees (socket values) natively.
frap-nodes.workspace = true
frap-gltf.workspace = true
# M7 stabilization: `gltf_canonical` decodes EXT/KHR_meshopt_compression views with
# meshoptimizer's own decoder (the library Blender's bridge wraps), not with frap-gltf.
frap-codec-mesh = { workspace = true, features = ["meshopt"] }
frap-imbuf.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
indexmap.workspace = true
image-compare.workspace = true
# WP 1.8: PNG decoding of image fixtures and glTF images (the judge does not use frap-imbuf's codecs).
png.workspace = true
automod.workspace = true

[dev-dependencies]
insta.workspace = true
smol_str.workspace = true

[lints]
workspace = true
