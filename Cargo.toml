frap-lua = { path = "crates/frap-lua", version = "0.1.0" }

# ---------------------------------------------------------------- external (§3.5)
# Exact patch versions are locked in Cargo.lock. Entries for later milestones are declared
# here already (so the version decision is visible) but no member uses them until that
# milestone's W0. M7 W0 put draco-core, meshopt (frap-codec-mesh, features `draco`/`meshopt`),
# ktx2, basisu and basisu_c_sys (frap-imbuf, features `basisu`/`basisu-encode`) in use; spade
# stays unused. M3+M4 W0 put
# faer (frap-uv), bevy_mikktspace (frap-geom), manifold-rust (frap-boolean) and opensubdiv-rs
# (frap-subdiv, default feature `osd` since the M4 gate) in use.
# `libm`: glam uses libm for its transcendentals too (rule 2.2.12, byte-stable across OSes).
glam = { version = "0.34.3", features = ["serde", "approx-05", "libm"] }
wgpu = { version = "30.0.2", default-features = false, features = ["wgsl", "metal", "vulkan", "dx12", "std"] }
libm = "0.2"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
pollster = "1.0.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "hdr", "exr", "tga", "bmp"] }
png = "0.18.1"
exr = "1.74.3"
webp = "0.3.1"
ktx2 = "0.5.0"
# M7 W0: without its `zstd` feature, whose ruzstd 0.7 has RUSTSEC-2026-0344 (decompression
# bomb); KTX2 zstd supercompression goes through ruzstd >= 0.9.1 directly (frap-imbuf `basisu`).
basisu = { version = "0.1.0", default-features = false, features = ["std"] }
ruzstd = "0.9.1"
basisu_c_sys = { version = "0.9.1", default-features = false }
meshopt = "0.7.0"
draco-core = "=2.3.3"
manifold-rust = "=0.19.2"
opensubdiv-rs = "=0.7.0"
bevy_mikktspace = "1.0.0"
spade = "2.15.1"
# M8 W0 (decision log M8W0-9): the Lua spike (frap-lua feature `lua`, off; WP 8.10). Lua 5.4
# vendored: built with `cc` only when the feature is on.
mlua = { version = "0.12.2", default-features = false, features = ["lua54", "vendored"] }
earcut = "0.4.12"
faer = { version = "0.24.4", features = ["sparse", "sparse-linalg"] }
smallvec = { version = "1.16.1", features = ["const_generics", "union", "serde"] }
rustc-hash = "2.1.3"
indexmap = { version = "2.14.2", features = ["serde"] }
smol_str = { version = "0.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip", "raw_value"] }
zip = { version = "9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.11.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
half = "2.7.1"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
schemars = "1.2.3"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
linkme = "0.3.38"
automod = "1.0.17"
# Added in M1 W0 (RFC 0001 F-DEP-1 and the Decision log, "M1 W0 integrator" entry):
bitflags = { version = "2.13", features = ["serde"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full", "extra-traits"] }
toml = "1.2.1"

# fuzz/Cargo.toml is outside this workspace (cargo-fuzz), so it cannot inherit from this table;
# its one external dependency is pinned there: libfuzzer-sys 0.4 (add `arbitrary` there if needed).

# dev
# `glob` for corpus-style snapshot tests (`insta::glob!`: WP 1.3 statement corpus, WP 1.18 per-op
# snapshots), `yaml`/`redactions` for readable snapshots with unstable fields masked.
insta = { version = "1.49", features = ["json", "glob", "yaml", "redactions"] }
approx = "0.5.1"
proptest = "1.12"
trycmd = "1.2.1"
assert_cmd = "2.2.2"
rstest = "0.28"
image-compare = "0.5"
gltf = { version = "=1.4.1", default-features = false, features = ["names", "utils"] }

[workspace.lints.rust]
# RFC 0001 F-LINK-1: `linkme` registration expands to `#[link_section]`, which the `unsafe_code`
# lint flags, so `forbid` is impossible in registering crates. Every crate denies it; the only
# allowed exception is `#[allow(unsafe_code)]` on a linkme slice declaration or entry (§21.6).
unsafe_code = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
# FrapError/RnaError carry Blender's message plus structured detail; errors are the cold path
# of one statement, so their size does not matter.
result_large_err = "allow"
large_enum_variant = "allow"

[profile.release]
panic = "unwind"

[profile.dev]
# Keep test binaries small and quick to link.
debug = "line-tables-only"

# Render output in debug builds (M5+M6 stabilization): the per-pixel colour management, the
# output conversions and the PNG / zlib encoders dominate a `render.render(write_still=True)`
# (a 1920x1080 PNG took about 6 s unoptimised), so they are optimised in dev and test builds
# too. Rust does not contract or reorder float arithmetic, so the samples are the same.
[profile.dev.package.frap-color]
opt-level = 3
# `frap-color`'s processors are generic / inlined into the caller's codegen units.
[profile.dev.package.frap-ops-render]
opt-level = 2
# The film readback (`workbench::color`).
[profile.dev.package.frap-render]
opt-level = 2
[profile.dev.package.frap-imbuf]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
