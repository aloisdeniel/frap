# SPDX-License-Identifier: GPL-3.0-or-later
#
# frap workspace (ARCHITECTURE §3). Owned by the integrator (M1 W0: WP 1.0).
# Rule 2.2.3: every external dependency is declared here once; members use `foo.workspace = true`.
# A new external dependency needs the integrator (and an RFC, §21.8).
#
# Every crate of §3.2 exists from M1 W0 on. Crates of later milestones are empty shells
# (frap-codec-mesh, frap-ops-anim): their W0 fills in dependencies and contracts. M3+M4 W0
# filled frap-uv, frap-subdiv, frap-boolean, frap-modifiers and frap-ops-uv.

[workspace]
resolver = "3"
members = [
    # L0
    "crates/frap-math",
    "crates/frap-macros",
    # L1
    "crates/frap-rna",
    "crates/frap-geom",
    "crates/frap-color",
    "crates/frap-lang",
    # L2 (generated by `cargo xtask codegen`, WP 1.1)
    "crates/frap-spec-rna",
    "crates/frap-spec-ops-object",
    "crates/frap-spec-ops-transform",
    "crates/frap-spec-ops-mesh",
    "crates/frap-spec-ops-uv",
    "crates/frap-spec-ops-anim",
    "crates/frap-spec-ops-data",
    "crates/frap-spec-ops-io",
    "crates/frap-spec-ops-render",
    "crates/frap-spec-ops-frap",
    "crates/frap-spec-catalog",
    # L3
    "crates/frap-anim",
    "crates/frap-gltf",
    "crates/frap-imbuf",
    "crates/frap-codec-mesh",
    # M7 W0: optional cc-built Google Draco fallback of `DracoCodec` (feature `draco-sys`, off;
    # WP 7.2 fills it only if the draco-core spike gate fails, §22.9).
    "crates/frap-draco-sys",
    "crates/frap-uv",
    "crates/frap-subdiv",
    "crates/frap-boolean",
    # L4
    "crates/frap-mesh",
    "crates/frap-nodes",
    # L5
    "crates/frap-bmesh",
    # L6
    "crates/frap-scene",
    # L7
    "crates/frap-modifiers",
    "crates/frap-material",
    # L8
    "crates/frap-eval",
    "crates/frap-render-scene",
    # L9
    "crates/frap-op",
    "crates/frap-render",
    "crates/frap-io-gltf",
    "crates/frap-project",
    # L10
    "crates/frap-ops-object",
    "crates/frap-ops-transform",
    "crates/frap-ops-mesh",
    "crates/frap-ops-uv",
    "crates/frap-ops-anim",
    "crates/frap-ops-data",
    "crates/frap-ops-io",
    "crates/frap-ops-render",
    "crates/frap-ops-frap",
    "crates/frap-ops-all",
    # L11
    "crates/frap-session",
    "crates/frap-schema",
    # L12
    "crates/frap-cli",
    "crates/frap-golden",
    # test-only crates (rule 2.2.11: operator behaviour tests that need a Session)
    "crates/frap-ops-io-tests",
    "crates/frap-ops-render-tests",
    # M8 W0 (decision log M8W0-9): the §21.7 budgets (WP 8.8) and the Lua spike (WP 8.10).
    "crates/frap-perf-tests",
    "crates/frap-lua",
    # tooling (cargo xtask ...)
    "xtask",
]
# cargo-fuzz targets (WP 1.3 owns `fuzz/fuzz_targets/lang_*.rs`): a separate workspace with its
# own lockfile, built by `cargo +nightly fuzz` and checked on stable by CI (`fuzz/Cargo.toml`).
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
repository = "https://github.com/aloisdeniel/frap"
publish = false

[workspace.dependencies]
# ---------------------------------------------------------------- internal (path deps)
frap-math = { path = "crates/frap-math", version = "0.1.0" }
frap-macros = { path = "crates/frap-macros", version = "0.1.0" }
frap-rna = { path = "crates/frap-rna", version = "0.1.0" }
frap-geom = { path = "crates/frap-geom", version = "0.1.0" }
frap-color = { path = "crates/frap-color", version = "0.1.0" }
frap-lang = { path = "crates/frap-lang", version = "0.1.0" }
frap-spec-rna = { path = "crates/frap-spec-rna", version = "0.1.0" }
frap-spec-ops-object = { path = "crates/frap-spec-ops-object", version = "0.1.0" }
frap-spec-ops-transform = { path = "crates/frap-spec-ops-transform", version = "0.1.0" }
frap-spec-ops-mesh = { path = "crates/frap-spec-ops-mesh", version = "0.1.0" }
frap-spec-ops-uv = { path = "crates/frap-spec-ops-uv", version = "0.1.0" }
frap-spec-ops-anim = { path = "crates/frap-spec-ops-anim", version = "0.1.0" }
frap-spec-ops-data = { path = "crates/frap-spec-ops-data", version = "0.1.0" }
frap-spec-ops-io = { path = "crates/frap-spec-ops-io", version = "0.1.0" }
frap-spec-ops-render = { path = "crates/frap-spec-ops-render", version = "0.1.0" }
frap-spec-ops-frap = { path = "crates/frap-spec-ops-frap", version = "0.1.0" }
frap-spec-catalog = { path = "crates/frap-spec-catalog", version = "0.1.0" }
frap-anim = { path = "crates/frap-anim", version = "0.1.0" }
frap-gltf = { path = "crates/frap-gltf", version = "0.1.0" }
frap-imbuf = { path = "crates/frap-imbuf", version = "0.1.0" }
frap-codec-mesh = { path = "crates/frap-codec-mesh", version = "0.1.0" }
frap-draco-sys = { path = "crates/frap-draco-sys", version = "0.1.0" }
frap-uv = { path = "crates/frap-uv", version = "0.1.0" }
frap-subdiv = { path = "crates/frap-subdiv", version = "0.1.0" }
frap-boolean = { path = "crates/frap-boolean", version = "0.1.0" }
frap-mesh = { path = "crates/frap-mesh", version = "0.1.0" }
frap-nodes = { path = "crates/frap-nodes", version = "0.1.0" }
frap-bmesh = { path = "crates/frap-bmesh", version = "0.1.0" }
frap-scene = { path = "crates/frap-scene", version = "0.1.0" }
frap-modifiers = { path = "crates/frap-modifiers", version = "0.1.0" }
frap-material = { path = "crates/frap-material", version = "0.1.0" }
frap-eval = { path = "crates/frap-eval", version = "0.1.0" }
frap-render-scene = { path = "crates/frap-render-scene", version = "0.1.0" }
frap-op = { path = "crates/frap-op", version = "0.1.0" }
frap-render = { path = "crates/frap-render", version = "0.1.0" }
frap-io-gltf = { path = "crates/frap-io-gltf", version = "0.1.0" }
frap-project = { path = "crates/frap-project", version = "0.1.0" }
frap-ops-object = { path = "crates/frap-ops-object", version = "0.1.0" }
frap-ops-transform = { path = "crates/frap-ops-transform", version = "0.1.0" }
frap-ops-mesh = { path = "crates/frap-ops-mesh", version = "0.1.0" }
frap-ops-uv = { path = "crates/frap-ops-uv", version = "0.1.0" }
frap-ops-anim = { path = "crates/frap-ops-anim", version = "0.1.0" }
frap-ops-data = { path = "crates/frap-ops-data", version = "0.1.0" }
frap-ops-io = { path = "crates/frap-ops-io", version = "0.1.0" }
frap-ops-render = { path = "crates/frap-ops-render", version = "0.1.0" }
frap-ops-frap = { path = "crates/frap-ops-frap", version = "0.1.0" }
frap-ops-all = { path = "crates/frap-ops-all", version = "0.1.0" }
