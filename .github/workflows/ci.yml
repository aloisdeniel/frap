# SPDX-License-Identifier: GPL-3.0-or-later
#
# frap CI (ARCHITECTURE §20.5, §22.1). Owned by the integrator (M1 W0: WP 1.0).
# - test:      clippy -D warnings and the whole test suite on macOS arm64, Linux x86_64 and
#              Windows x86_64; the registry self-check (§10.5) and the CLI transcripts again in
#              the release profile with fat LTO (where linkme entries would be dropped).
# - checks:    rustfmt, `cargo xtask check-deps` (layers, dev-dependency cycles), `cargo xtask
#              codegen --check`, `cargo deny check`, the build without the `gpu` feature, and
#              the cargo-fuzz targets (`fuzz/`, its own workspace) compile on stable.
# - cc-only:   a clean container with only cc/c++ (no cmake, no libclang) builds the default
#              features (rule 2.2.9).
# - budgets:   clean build time of each frap-spec-* crate vs xtask/budgets.toml (§4.2).
# - blender-live: Blender 5.2 differential tests, nightly and on demand (skipped elsewhere).
# GPU adapters (Metal / lavapipe / WARP) are exercised by gpu.yml.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Same pin as gpu.yml (the test job renders the M1 exit transcript).
  WARP_VERSION: "1.0.20"
  # GPU tests skip with a visible notice here; gpu.yml runs them on real/software adapters.
  FRAP_GPU_OPTIONAL: "1"
  # The EEVEE scene goldens (about 35 min on WARP) render in gpu.yml only, on every adapter.
  FRAP_SKIP_EEVEE_SCENES: "1"

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: windows-x86_64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      # Transcripts and fixtures are compared byte for byte: keep LF endings on Windows.
      - name: git config (no CRLF conversion)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The M1 exit transcript (tests/cli/m1/vertical_slice*) renders with Workbench, so the test
      # job needs an adapter on every OS: lavapipe on Linux, WARP on Windows, Metal on macOS
      # (same setup as gpu.yml). Must run after rust-cache (it restores target/).
      - name: (Linux) Install Mesa lavapipe
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - name: (Windows) Install WARP ${{ env.WARP_VERSION }}
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          curl.exe -L --retry 5 "https://www.nuget.org/api/v2/package/Microsoft.Direct3D.WARP/${WARP_VERSION}" -o warp.zip
          mkdir -p warp
          # Git Bash's GNU tar cannot read a zip (the .nupkg); Windows' own bsdtar can.
          /c/Windows/System32/tar.exe -xf warp.zip -C warp build/native/bin/x64/d3d10warp.dll
          for d in target/debug target/debug/deps target/release target/release/deps; do
            mkdir -p "$d" && cp warp/build/native/bin/x64/d3d10warp.dll "$d/"
          done
      - name: clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: tests
        run: cargo test --workspace --locked --no-fail-fast
      - name: registry self-check and transcripts (release, fat LTO)
        env:
          CARGO_PROFILE_RELEASE_LTO: "fat"
        run: cargo test --release --locked -p frap-ops-all --test registry -p frap-cli --test transcripts
      - name: frap-uv packer goldens and invariants (release only; ignored in debug builds)
        run: cargo test --release --locked -p frap-uv --test blender_goldens --test pack_invariants

  checks:
    name: checks (fmt, deps, codegen, deny, no-gpu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: rustfmt on automod modules (every tracked hand-written .rs)
        run: cargo xtask fmt --check
      - name: dependency rules (layers, no dev-dependency cycles)
        run: cargo xtask check-deps
      - name: generated code is up to date
        run: cargo xtask codegen --check
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
      - name: fuzz targets compile (separate workspace; fuzzing itself needs nightly + cargo-fuzz)
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --check
          cargo check --manifest-path fuzz/Cargo.toml --locked
      - name: build without the gpu feature (render.render -> GPU_UNAVAILABLE)
        run: |
          cargo clippy -p frap-cli --no-default-features --locked -- -D warnings
          cargo test -p frap-session --locked

  cc-only:
    name: clean container with only cc/c++ (default features)
    runs-on: ubuntu-24.04
    container:
      image: rust:1.97-slim-bookworm
    steps:
      - name: only a C/C++ compiler (no cmake, no libclang)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc g++ libc6-dev pkg-config ca-certificates git
          ! command -v cmake
          ! command -v clang
      - uses: actions/checkout@v4
      - name: build the frap binary with default features
        run: cargo build -p frap-cli --locked

  budgets:
    name: frap-spec-* build-time budgets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      # The committed baselines are provisional (recorded on an M1 Max by WP 1.1, decision log
      # W1-2). Non-gating until they are re-recorded here with `cargo xtask budgets --record`.
      - name: budgets (fails above 2x the recorded baseline; non-gating until re-recorded on CI)
        continue-on-error: true
        run: cargo xtask budgets

  blender-live:
    name: blender-live (linux-x86_64, Blender 5.2.4)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      BLENDER_VERSION: "5.2.4"
      FRAP_REQUIRE_BLENDER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - name: cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -fsSL -A "frap-ci" \
            "https://download.blender.org/release/Blender5.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            | tar -xJ -C ~/blender --strip-components=1
      - name: system libraries for headless Blender
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6
      - name: Blender differential tests
        run: |
          export BLENDER_BIN="$HOME/blender/blender"
          "$BLENDER_BIN" --version
          cargo test -p frap-cli --locked --test blender_live -- --nocapture
